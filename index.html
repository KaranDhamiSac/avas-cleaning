<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eva's Cleaning</title>
<meta name="description" content="Eva's Cleaning — house and office cleaning in the Sacramento area. Free estimates. Estimados gratis. Se habla español.">
<link rel="icon" type="image/svg+xml" href="assets/logo/logo-1-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #C2416B;        /* main accent */
    --rose-dark: #9B2C52;   /* hover, headings */
    --blush: #F9DCE3;       /* soft pink panels */
    --soft: #FDF1F4;        /* page background */
    --white: #FFFFFF;
    --ink: #2E2E33;         /* dark gray text */
    --muted: #6E6670;
    --line: #F1D2DB;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; font-family: "DM Sans", system-ui, sans-serif; color: var(--ink);
    background: var(--soft); line-height: 1.6; font-size: 17px;
  }
  h1, h2, h3 { line-height: 1.15; margin: 0 0 .5em; font-weight: 700; letter-spacing: -.01em; }
  a { color: inherit; }
  img { max-width: 100%; display: block; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

  /* Top strip: tap-to-call + free estimates */
  .topbar { background: var(--rose); color: var(--white); font-size: .95rem; font-weight: 700; }
  .topbar .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 42px; }
  .topbar a { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .topbar a:hover { text-decoration: underline; }

  header {
    position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.95);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 72px; }
  .logo img { height: 48px; width: auto; }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .lang { display: inline-flex; border: 1.5px solid var(--rose); border-radius: 999px; overflow: hidden; }
  .lang button {
    border: 0; background: transparent; color: var(--rose-dark); font: inherit; font-weight: 700;
    font-size: .85rem; padding: 6px 12px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--rose); color: var(--white); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 26px; border-radius: 999px; text-decoration: none; border: 2px solid transparent;
    cursor: pointer; font: inherit; font-weight: 700; transition: transform .15s ease, background .15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--rose); color: var(--white); }
  .btn-primary:hover { background: var(--rose-dark); }
  .btn-ghost { border-color: var(--rose); color: var(--rose-dark); background: var(--white); }
  .btn-white { background: var(--white); color: var(--rose-dark); }
  .btn-sm { padding: 9px 16px; font-size: .92rem; }
  .btn-lg { padding: 18px 32px; font-size: 1.1rem; }

  /* Photo slots: show the image if it exists, otherwise a labeled placeholder */
  .photo {
    position: relative; margin: 0; overflow: hidden; border-radius: var(--radius);
    background: repeating-linear-gradient(45deg, var(--blush), var(--blush) 12px, #fbe6eb 12px, #fbe6eb 24px);
    border: 2px dashed #E7A9BB; display: grid; place-items: center; text-align: center;
    color: var(--rose-dark); font-size: .85rem; font-weight: 700; padding: 12px;
  }
  .photo::before { content: "📷  " attr(data-label); white-space: pre-wrap; }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo:has(img) { border-style: solid; border-color: transparent; }

  /* Hero */
  .hero { padding: 56px 0; }
  .hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 44px; align-items: center; }
  .tagline {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    background: var(--white); color: var(--rose-dark); border: 2px solid var(--rose);
    font-weight: 700; padding: 6px 16px; border-radius: 999px; margin-bottom: 18px;
  }
  .hero h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); }
  .hero h1 em { font-style: normal; color: var(--rose); }
  .hero .lead { font-size: 1.15rem; color: var(--muted); max-width: 34em; margin: 0 0 28px; }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .hero-note { margin-top: 16px; color: var(--muted); font-size: .95rem; }
  .hero .photo { aspect-ratio: 4 / 3.4; }

  .why { background: var(--white); border-block: 1px solid var(--line); padding: 26px 0; }
  .why ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .why li { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; }
  .why li::before {
    content: "✓"; flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--blush);
    color: var(--rose-dark); font-weight: 700; display: grid; place-items: center; font-size: .85rem;
  }

  section { padding: 64px 0; }
  .section-head { text-align: center; max-width: 640px; margin: 0 auto 36px; }
  .section-head h2 { font-size: clamp(1.8rem, 4vw, 2.4rem); }
  .section-head p { color: var(--muted); margin: 0; }

  .services { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .service { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
  .service .icon {
    width: 48px; height: 48px; border-radius: 14px; background: var(--blush);
    display: grid; place-items: center; font-size: 1.5rem; margin-bottom: 14px;
  }
  .service h3 { font-size: 1.1rem; margin-bottom: .3em; }
  .service p { margin: 0; color: var(--muted); font-size: .95rem; }

  .gallery-section { background: var(--white); border-block: 1px solid var(--line); }
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .gallery .photo { aspect-ratio: 1; }

  /* Reviews: auto-scrolling banner */
  .reviews { padding-bottom: 72px; }
  .marquee {
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
  }
  .track { display: flex; gap: 16px; width: max-content; padding: 4px 0; animation: marquee 45s linear infinite; }
  .marquee:hover .track, .marquee:focus-within .track { animation-play-state: paused; }
  @keyframes marquee { to { transform: translateX(calc(-50% - 8px)); } }
  .review {
    flex: none; width: 310px; background: var(--white); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 10px;
  }
  .review .stars { color: var(--rose); font-size: 1.15rem; letter-spacing: 3px; }
  .review blockquote { margin: 0; color: var(--ink); flex: 1; }
  .review cite { font-style: normal; font-weight: 700; color: var(--rose-dark); font-size: .95rem; }
  .review.empty blockquote, .review.empty cite { color: var(--muted); font-style: italic; font-weight: 500; }
  .review.empty { border: 2px dashed #E7A9BB; }
  @media (prefers-reduced-motion: reduce) {
    .marquee { overflow-x: auto; -webkit-mask-image: none; mask-image: none; }
    .track { animation: none; padding: 4px 16px; }
    .track [aria-hidden="true"] { display: none; }
  }
  @media (max-width: 600px) { .review { width: 260px; } .track { animation-duration: 35s; } }

  .about-grid { display: grid; grid-template-columns: .8fr 1.2fr; gap: 48px; align-items: center; }
  .about .photo { aspect-ratio: 1; max-width: 380px; width: 100%; border-radius: 50%; }
  .about h2 { font-size: clamp(1.8rem, 4vw, 2.4rem); }
  .about p { color: var(--muted); }

  /* Big free-estimate band */
  .cta-band { background: var(--rose); color: var(--white); padding: 48px 0; text-align: center; }
  .cta-band h2 { font-size: clamp(2rem, 5vw, 3rem); margin-bottom: .2em; }
  .cta-band p { margin: 0 0 24px; opacity: .92; font-size: 1.1rem; }
  .cta-band .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .cta-band .btn-ghost { background: transparent; border-color: var(--white); color: var(--white); }

  .estimate-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 40px; align-items: start; }
  .estimate-info h2 { font-size: clamp(1.8rem, 4vw, 2.4rem); }
  .estimate-info p { color: var(--muted); }
  .contact-card { margin-top: 20px; padding: 20px; border-radius: var(--radius); background: var(--blush); display: grid; gap: 14px; }
  .contact-card small { display: block; color: var(--muted); font-weight: 500; }
  .contact-card .big { font-size: 1.8rem; font-weight: 700; color: var(--rose-dark); text-decoration: none; }
  .contact-card .email { font-weight: 700; color: var(--rose-dark); }
  .placeholder {
    display: inline-block; border: 2px dashed var(--rose); border-radius: 8px; padding: 1px 8px;
    color: var(--rose-dark); background: #fff6f8; font-weight: 700; font-size: .9em;
  }

  form { background: var(--white); border: 1px solid var(--line); border-radius: 24px; padding: 28px; display: grid; gap: 16px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label { display: grid; gap: 6px; font-weight: 700; font-size: .92rem; }
  input, select, textarea {
    font: inherit; font-weight: 400; padding: 12px 14px; border: 1.5px solid var(--line);
    border-radius: 12px; background: var(--soft); color: var(--ink); width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--rose); background: var(--white); }
  textarea { min-height: 96px; resize: vertical; }
  .form-note { font-size: .85rem; color: var(--muted); margin: 0; text-align: center; }
  .form-done { display: none; background: var(--blush); color: var(--rose-dark); border-radius: 12px; padding: 14px; font-weight: 600; }
  .form-done.show { display: block; }

  footer { background: var(--white); border-top: 1px solid var(--line); padding: 36px 0; color: var(--muted); }
  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 20px; align-items: center; }
  footer .logo img { height: 42px; }
  footer a { color: var(--rose-dark); font-weight: 700; }

  .call-bar { display: none; }

  @media (max-width: 900px) {
    .services { grid-template-columns: repeat(2, 1fr); }
    .why ul { grid-template-columns: repeat(2, 1fr); }
    .hero-grid, .about-grid, .estimate-grid { grid-template-columns: 1fr; }
    .about .photo { max-width: 260px; margin: 0 auto; }
  }
  @media (max-width: 600px) {
    body { font-size: 16px; padding-bottom: 76px; }
    .wrap { padding: 0 16px; }
    .nav { height: 64px; }
    .logo img { height: 38px; }
    .nav .btn-est { display: none; }
    .topbar .wrap { justify-content: center; }
    .topbar .est-link { display: none; }
    .hero { padding: 32px 0 40px; }
    section { padding: 48px 0; }
    .services, .row, .why ul { grid-template-columns: 1fr; }
    .gallery { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .hero-actions .btn { flex: 1 1 100%; }
    form { padding: 20px; }
    .call-bar {
      display: flex; gap: 10px; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--white);
      border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(0,0,0,.06);
    }
    .call-bar .btn { flex: 1; padding: 12px; }
  }
</style>
</head>

<!-- Tap-to-call strip, always at the very top -->
<div class="topbar">
  <div class="wrap">
    <a class="js-tel" href="#">📞 <span data-i18n="callText"></span> <span class="js-phone"></span></a>

  </div>
</div>

<header>

    <div class="nav-right">
      <div class="lang" role="group" aria-label="Language / Idioma">

  <!-- REVIEWS: edit the list in CONFIG.reviews in the script below -->

  <section class="about" id="about">

  <section id="estimate">
    <div class="wrap estimate-grid">
      <div class="estimate-info">
        <h2 data-i18n="estTitle"></h2>
        <p data-i18n="estLead"></p>
        <div class="contact-card">
          <div>
            <small data-i18n="orCall"></small>
            <a class="big js-tel" href="#"><span class="js-phone"></span></a>
          </div>
          <div>
            <small data-i18n="emailLabel"></small>
            <span class="js-email"></span>
          </div>
        </div>
      </div>

      <form id="estimate-form" novalidate>
        <div class="row">
          <label><span data-i18n="fName"></span><input name="name" autocomplete="name" required></label>
          <label><span data-i18n="fPhone"></span><input name="phone" type="tel" autocomplete="tel" required></label>
        </div>
        <label><span data-i18n="fAddress"></span><input name="address" autocomplete="street-address" data-i18n-ph="fAddressPh" required></label>
        <div class="row">
          <label><span data-i18n="fService"></span>
            <select name="service">
              <option value="home" data-i18n="s1t"></option>
              <option value="deep" data-i18n="s2t"></option>
              <option value="move" data-i18n="s3t"></option>
              <option value="office" data-i18n="s4t"></option>
            </select>
          </label>
          <label><span data-i18n="fSize"></span><input name="size" data-i18n-ph="fSizePh"></label>
        </div>
        <label><span data-i18n="fNotes"></span><textarea name="notes" data-i18n-ph="fNotesPh"></textarea></label>
        <button class="btn btn-primary" type="submit" data-i18n="fSubmit"></button>
        <div class="form-done" role="status"></div>
        <p class="form-note" data-i18n="fNote"></p>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot">
    <div>
      <div class="logo"><img src="assets/logo/logo-1-full.svg" alt="Eva's Cleaning" width="166" height="42"></div>
      <div data-i18n="area"></div>
    </div>
    <div>
      <a class="js-tel" href="#"><span class="js-phone"></span></a> · <span class="js-email"></span><br>
      <small>© <span id="year"></span> Eva's Cleaning</small>
    </div>
  </div>
</footer>

<div class="call-bar">
  <a class="btn btn-primary js-tel" href="#">📞 <span data-i18n="callNow"></span></a>
  <a class="btn btn-ghost" href="#estimate" data-i18n="tagline"></a>
</div>

      callNow: "Llamar ahora",
      tagline: "Estimados gratis",
      heroTitle: "Un hogar impecable, <em>sin estrés.</em>",
      heroLead: "Limpieza de casas confiable y detallada en el área de Sacramento, de alguien que cuida su hogar como si fuera suyo. Semanal, cada dos semanas, mensual o una sola vez.",
      ctaEstimate: "Pida su estimado gratis",
      heroNote: "We speak English, too.",
      why1: "Estimados gratis y sin compromiso",
      why2: "Honesta, confiable y puntual",
      why3: "Cuidadosa con su casa y sus cosas",
      why4: "Horarios flexibles",
      servicesTitle: "Servicios de limpieza",
      servicesLead: "Cada hogar es diferente. Díganos qué necesita y haremos un plan a su medida.",
      s1t: "Limpieza regular de casa",
      s1d: "Cocinas, baños, pisos y polvo — todo limpio con el horario que usted prefiera.",
      s2t: "Limpieza profunda",
      s2d: "Limpieza completa de zócalos, electrodomésticos y todos los rincones olvidados.",
      s3t: "Mudanzas (entrada / salida)",
      s3d: "Deje su casa anterior impecable o empiece de nuevo en la nueva.",
      s4t: "Oficinas y espacios pequeños",
      s4d: "Espacios de trabajo limpios y agradables para oficinas y pequeños negocios.",
      galleryTitle: "Nuestro trabajo",
      galleryLead: "Algunas casas que hemos limpiado recientemente.",
      reviewsTitle: "Lo que dicen nuestros clientes",
      reviewsLead: "Trabajo honesto a un precio justo.",
      reviewEmpty: "Reseña de cliente próximamente",
      reviewEmptyName: "Nombre del cliente",
      aboutTitle: "Hola, soy Eva",
      about1: "Limpio casas en el área de Sacramento desde 2024 y me enorgullece hacerlo bien. Mis clientes me confían sus hogares porque soy cuidadosa, constante y presto atención a los detalles.",
      about2: "Cuando llama, habla conmigo — no con una oficina. Visito su casa, veo el espacio y le doy un precio justo. El estimado siempre es gratis.",
      bandLead: "Sin costo y sin compromiso. Llame, mande un texto o llene el formulario.",
      estTitle: "Pida su estimado gratis",
      estLead: "Llene el formulario y Eva se comunicará con usted para acordar una cita.",
      orCall: "¿Prefiere hablar? Llame o mande un texto",
      emailLabel: "Correo electrónico",
      emailSoon: "CORREO PRÓXIMAMENTE",
      fName: "Su nombre",
      fPhone: "Teléfono",
      fAddress: "Dirección",
      fAddressPh: "Calle, ciudad, código postal",
      fService: "Tipo de limpieza",
      fSize: "Tamaño de la casa (opcional)",
      fSizePh: "ej. 3 recámaras, 2 baños",
      fNotes: "¿Algo más? (opcional)",
      fNotesPh: "Mascotas, días preferidos, pedidos especiales…",
      fSubmit: "Enviar mi solicitud",
      fNote: "Esto abre un mensaje de texto para Eva con sus datos ya escritos.",
      fDone: "¡Gracias! Solo presione enviar en su app de mensajes. Si no se abrió, llame o mande un texto al número de arriba.",
      fMissing: "Por favor escriba su nombre, teléfono y dirección.",
      photoSlot: "Foto",
      area: "Sirviendo a Sacramento y sus alrededores"
    }
  };

  // Eva reads the incoming text in Spanish, no matter which language the customer used.
  const SERVICE_ES = { home: "Limpieza regular", deep: "Limpieza profunda", move: "Mudanza", office: "Oficina" };

  // Gallery slots
  const gallery = document.getElementById("gallery");
  for (let i = 1; i <= CONFIG.galleryCount; i++) {
    const f = document.createElement("figure");
    f.className = "photo";
    f.dataset.label = `assets/photos/gallery-${i}.jpg`;
    const img = new Image();
    img.alt = ""; img.loading = "lazy"; img.src = f.dataset.label;
    img.onerror = () => img.remove();
    f.appendChild(img);
    gallery.appendChild(f);
  }

  let lang = "en";
  function renderEmail() {
    document.querySelectorAll(".js-email").forEach(el => {
      el.innerHTML = "";
      if (CONFIG.email) {
        const a = document.createElement("a");
        a.href = "mailto:" + CONFIG.email; a.textContent = CONFIG.email; a.className = "email";
        el.appendChild(a);
      } else {
        const p = document.createElement("span");
        p.className = "placeholder"; p.textContent = T[lang].emailSoon;
        el.appendChild(p);
      }
    });
  }

  function renderReviews() {
    const track = document.getElementById("review-track");
    track.innerHTML = "";
    const make = (r, hidden) => {
      const card = document.createElement("figure");
      card.className = "review" + (r.text ? "" : " empty");
      if (hidden) card.setAttribute("aria-hidden", "true");
      const stars = document.createElement("div");
      const n = Math.max(1, Math.min(5, r.stars || 5));
      stars.className = "stars"; stars.textContent = "★".repeat(n) + "☆".repeat(5 - n);
      stars.setAttribute("aria-label", n + " / 5");
      const q = document.createElement("blockquote");
      q.textContent = r.text ? "“" + r.text + "”" : T[lang].reviewEmpty;
      const c = document.createElement("cite");
      c.textContent = "— " + (r.name || T[lang].reviewEmptyName);
      card.append(stars, q, c);
      return card;
    };
    // Two copies back to back so the banner loops seamlessly.
    CONFIG.reviews.forEach(r => track.appendChild(make(r, false)));
    CONFIG.reviews.forEach(r => track.appendChild(make(r, true)));
  }

  function setLang(l) {
    lang = T[l] ? l : "en";
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T[lang][el.dataset.i18n]; });
    document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = T[lang][el.dataset.i18nHtml]; });
    document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = T[lang][el.dataset.i18nPh]; });
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    renderEmail();
    renderReviews();
    try { localStorage.setItem("lang", lang); } catch (e) {}
  }

  document.querySelectorAll(".js-phone").forEach(el => el.textContent = CONFIG.phoneDisplay);
  document.querySelectorAll(".js-tel").forEach(el => el.href = "tel:" + CONFIG.phoneDial);
  document.getElementById("year").textContent = new Date().getFullYear();
  document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

  // Pick language: ?lang=es in the link > saved choice > browser language
  let initial = new URLSearchParams(location.search).get("lang");
  if (!initial) { try { initial = localStorage.getItem("lang"); } catch (e) {} }
  if (!initial) initial = (navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en";
  setLang(initial);

  // Estimate form -> prefilled text message to Eva
  document.getElementById("estimate-form").addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target, d = Object.fromEntries(new FormData(f));
    const done = f.querySelector(".form-done");
    if (!d.name.trim() || !d.phone.trim() || !d.address.trim()) {
      done.textContent = T[lang].fMissing; done.classList.add("show"); return;
    }
    const msg = [
      "Nuevo estimado - sitio web",
      "Nombre: " + d.name,
      "Teléfono: " + d.phone,
      "Dirección: " + d.address,
      "Servicio: " + SERVICE_ES[d.service],
      d.size ? "Tamaño: " + d.size : "",
      d.notes ? "Notas: " + d.notes : "",
      "Idioma del cliente: " + (lang === "es" ? "Español" : "Inglés")
    ].filter(Boolean).join("\n");
    done.textContent = T[lang].fDone; done.classList.add("show");
    location.href = "sms:" + CONFIG.phoneDial + "?&body=" + encodeURIComponent(msg);
  });
</script>
</body>
</html>
