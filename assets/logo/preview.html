<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo Options</title>
<style>
  body { margin: 0; padding: 24px 16px; font-family: system-ui, sans-serif; background: #fff; color: #2E2E33; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p { color: #6E6670; margin: 0 0 24px; }
  .opt { border: 1px solid #F3D3DC; border-radius: 16px; padding: 20px; margin-bottom: 20px; max-width: 760px; }
  .opt h2 { font-size: 1rem; margin: 0 0 14px; color: #9B2C52; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 24px; }
  .small { display: flex; align-items: flex-end; gap: 14px; }
  .small figure, .big figure { margin: 0; text-align: center; font-size: .75rem; color: #6E6670; }
  .small img { display: block; margin: 0 auto 4px; }
  .big img { display: block; max-width: 100%; }
  .pink { background: #FDF1F4; padding: 14px; border-radius: 10px; }
</style>
</head>
<body>
  <h1>Eva's Cleaning — logo options</h1>
  <p>Each option has a square mark (favicon, social profile) and a full logo (header, card).</p>
  <div id="list"></div>
<script>
  const names = { 1: "Option 1 — house + sparkle, script name", 2: "Option 2 — sparkle badge, elegant serif", 3: "Option 3 — monogram E, modern caps" };
  document.getElementById("list").innerHTML = [1, 2, 3].map(n => `
    <div class="opt">
      <h2>${names[n]}</h2>
      <div class="row">
        <div class="small">
          ${[16, 32, 64].map(s => `<figure><img src="logo-${n}-mark.svg" width="${s}" height="${s}" alt="">${s}px</figure>`).join("")}
        </div>
        <div class="big">
          <figure class="pink"><img src="logo-${n}-full.svg" style="height:44px" alt="Eva's Cleaning logo ${n}"></figure>
        </div>
      </div>
      <div class="big" style="margin-top:16px"><figure><img src="logo-${n}-full.svg" style="height:110px" alt=""></figure></div>
    </div>`).join("");
</script>
</body>
</html>
